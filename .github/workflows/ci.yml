name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret & Credential Safety Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for committed secrets and .env files
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: Local .env file committed to repository!"
            exit 1
          fi
          echo "Secret scanning completed: No unencrypted .env files committed."

  backend-unit-test:
    name: Backend Unit Test Suite (Offline)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
          DATA_MODE: LIVE
          ENVIRONMENT: test
        run: |
          python -m pytest backend/tests -v -m "not integration"

  backend-integration-test:
    name: Provider Integration Tests (Optional)
    runs-on: ubuntu-latest
    needs: backend-unit-test
    if: ${{ secrets.DATABASE_URL != '' || secrets.UPSTASH_REDIS_REST_URL != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Integration Tests
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BHOONIDHI_USER_ID: ${{ secrets.BHOONIDHI_USER_ID }}
          BHOONIDHI_PASSWORD: ${{ secrets.BHOONIDHI_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python -m pytest backend/tests/integration -v -m integration

  frontend-build:
    name: Frontend Build (Next.js 15)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Static & Serverless Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://sih2026-2myp.onrender.com
        run: npm run build

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-unit-test, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Production Image
        run: |
          docker build -f Dockerfile.backend -t sih26001-backend:ci-test .
